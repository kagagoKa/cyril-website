<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyril Almil D. Cordova - Official Website</title>

    <!-- SEO -->
    <meta name="description" content="Official website of Cyril Almil D. Cordova. Animated forest-tech themed homepage featuring microcontrollers and the Cagayan de Oro City seal.">
    <meta name="keywords" content="Cyril Almil D. Cordova, microcontrollers, Arduino, ESP8266, Cagayan de Oro, Philippines">
    <meta name="author" content="Cyril Almil D. Cordova">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80') 
                        no-repeat center center fixed;
            background-size: cover;
            color: white;
            overflow-x: hidden;
            animation: fadeIn 2s ease-in-out;
        }

        /* FLOATING PARTICLES */
        .particle {
            position: fixed;
            width: 8px;
            height: 8px;
            background: rgba(0,255,200,0.7);
            border-radius: 50%;
            animation: drift 12s infinite linear;
            filter: blur(2px);
        }

        @keyframes drift {
            from { transform: translateY(0) translateX(0); opacity: 1; }
            to { transform: translateY(-800px) translateX(200px); opacity: 0; }
        }

        /* COOL NAME */
        .cool-name {
            font-size: 85px;
            margin: 0;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #00ffcc;
            text-shadow:
                0 0 10px #00ffcc,
                0 0 20px #00ffaa,
                0 0 40px #00ffaa,
                0 0 80px #00ffaa;
            animation:
                nameGlow 3s infinite alternate,
                nameFloat 6s ease-in-out infinite,
                nameWave 5s ease-in-out infinite;
        }

        @keyframes nameGlow {
            from {
                text-shadow:
                    0 0 10px #00ffcc,
                    0 0 20px #00ffaa,
                    0 0 40px #00ffaa;
                color: #00ffcc;
            }
            to {
                text-shadow:
                    0 0 20px #00ffaa,
                    0 0 40px #00ffcc,
                    0 0 80px #00ffcc;
                color: #00ffaa;
            }
        }

        @keyframes nameFloat {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-18px); }
            100% { transform: translateY(0px); }
        }

        @keyframes nameWave {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(12deg); }
            100% { transform: rotateX(0deg); }
        }

        /* MAIN TITLE CONTAINER */
        .center {
            text-align: center;
            padding-top: 80px;
            animation: slideDown 2s ease-out;
        }

        p {
            font-size: 24px;
            margin-top: 15px;
            background: rgba(0,0,0,0.45);
            padding: 12px 30px;
            border-radius: 12px;
            display: inline-block;
            animation: fadeIn 3s ease-in-out;
        }

        /* SECTION BOXES */
        section {
            margin-top: 60px;
            text-align: center;
            background: rgba(0,0,0,0.55);
            padding: 40px;
            border-radius: 20px;
            width: 85%;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 35px rgba(0,255,170,0.5);
            animation: slideUp 2s ease-out;
            border: 2px solid rgba(0,255,170,0.4);
        }

        section:hover {
            box-shadow: 0 0 55px rgba(0,255,200,0.9);
            border-color: rgba(0,255,200,1);
            transform: scale(1.02);
            transition: 0.3s ease;
        }

        /* MICROCONTROLLER LIST */
        .micro-list {
            font-size: 24px;
            line-height: 1.8;
            animation: float 5s ease-in-out infinite;
        }

        /* COOLER ALIGNED SEAL */
        .seal-box {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: float 6s ease-in-out infinite;
        }

        .seal-frame {
            padding: 20px;
            border-radius: 20px;
            border: 3px solid rgba(0,255,200,0.7);
            box-shadow: 0 0 40px rgba(0,255,200,0.9);
            animation: glowPulse 3s infinite alternate;
            transition: 0.3s ease;
        }

        .seal-frame:hover {
            transform: scale(1.1) rotate(2deg);
            box-shadow: 0 0 60px rgba(0,255,255,1);
        }

        img {
            width: 260px;
            border-radius: 15px;
        }

        /* BASIC ANIMATIONS */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes glowPulse { from { text-shadow: 0 0 15px #00ffcc; } to { text-shadow: 0 0 40px #00ffaa; } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        @keyframes slideDown { from { transform: translateY(-80px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(80px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>

<body>

    <!-- PARTICLES -->
    <div class="particle" style="top:90%; left:10%; animation-delay:0s;"></div>
    <div class="particle" style="top:95%; left:40%; animation-delay:2s;"></div>
    <div class="particle" style="top:92%; left:70%; animation-delay:4s;"></div>
    <div class="particle" style="top:98%; left:20%; animation-delay:6s;"></div>
    <div class="particle" style="top:94%; left:80%; animation-delay:8s;"></div>

    <div class="center">
        <h1 class="cool-name">Cyril Almil D. Cordova</h1>
        <p>Welcome to my personal website.</p>
    </div>

    <section>
        <h2 style="animation: glowPulse 3s infinite alternate;">Microcontrollers I Use</h2>
        <div class="micro-list">
            - Arduino UNO R4 WiFi<br>
            - ESP8266<br>
            - nRF24L01+ modules<br>
            - E01-2G4M27D long-range module<br>
            - Custom sensor projects (chronograph, wireless systems)
        </div>
    </section>

    <section>
        <h2 style="animation: glowPulse 3s infinite alternate;">Cagayan de Oro City Seal</h2>
        <p>City of Golden Friendship</p>

        <div class="seal-box">
            <div class="seal-frame">
                <img src="https://github.com/kagagoKa/cyril-website/blob/1b09c012e589721f6eb6aeced00242d1daca8323/CityHall.jpg?raw=true" 
                     alt="Cagayan de Oro City Seal">
            </div>
        </div>
    </section>

</body>
</html>
