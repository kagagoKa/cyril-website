<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="googlef0227e2f71fbab47.html">
    <meta charset="UTF-8">
    <title>Cyril Almil D. Cordova</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=80') 
                        no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-shadow: 0 0 15px rgba(0,0,0,0.8);
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 60px;
            margin: 0;
            padding: 0;
            animation: glow 3s infinite alternate;
        }

        p {
            font-size: 22px;
            margin-top: 10px;
            background: rgba(0,0,0,0.4);
            padding: 10px 25px;
            border-radius: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #00ffcc; }
            to { text-shadow: 0 0 25px #00ffaa; }
        }

        .button {
            margin-top: 25px;
            padding: 12px 25px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #00ffaa;
            color: #00ffaa;
            font-size: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .button:hover {
            background: #00ffaa;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Cyril Almil D. Cordova</h1>
    <p>Welcome to my forest-themed personal website.</p>

    <div class="button">Explore</div>
</body>
</html>
